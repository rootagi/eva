[project]
name = "eva-cli"
version = "4.4.0"


description = "AI-powered terminal assistant focused on security, speed, and cross-platform workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "platformdirs>=4.0.0,<5.0.0",
    "keyring>=25.0.0,<26.0.0",
    "cryptography>=43.0.0,<51.0.0",
    "diskcache>=5.6.0,<6.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "rich>=13.0.0,<15.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pathspec>=0.12.0,<1.0.0",
    "openai>=1.40.0,<3.0.0",
    "google-genai>=0.1.0,<2.0.0",
    "tomli>=2.0.0,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pillow>=10.0.0",
    "piexif>=1.1.3",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pycryptodome>=3.20.0",
    "argon2-cffi>=23.1.0",
    "opencv-python-headless>=4.8.0",
    "click>=8.0.0",
    "yara-python>=4.5.0",
    "pefile>=2024.8.26",
    "pyelftools>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff>=0.5.0,<1.0.0",
]
fast = ["eva-fastwalk>=0.1.0,<0.2.0"]


[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "src/eva/security_tools/aegis_engine",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-v --cov=eva --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = [
    "src/eva/security_tools/aegis_engine/*",
]

[project.scripts]
eva = "eva.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eva"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

