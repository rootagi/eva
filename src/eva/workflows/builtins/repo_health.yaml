name: repo_health
description: "Repository health check: git status, recent commit log, branch state, and configuration audit."
version: "1.0"
steps:
  - name: Working Tree Status
    description: "Check for uncommitted, unstaged, or untracked changes."
    command: "git status --short"
    risk_level: "low"
  - name: Recent Commit Activity
    description: "Review recent commit log."
    command: "git log -n 5 --oneline"
    risk_level: "low"
  - name: Remote Configuration
    description: "Inspect configured git remotes."
    command: "git remote -v"
    risk_level: "low"
