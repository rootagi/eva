name: dependency_audit
description: "Dependency audit: inspect installed Python package list and check for issues."
version: "1.0"
steps:
  - name: List Installed Packages
    description: "Check currently installed Python dependencies."
    command: "python -m pip list"
    risk_level: "low"
  - name: Dependency Consistency Check
    description: "Check for broken dependencies or missing packages."
    command: "python -m pip check"
    risk_level: "low"
