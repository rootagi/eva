name: security_scan
description: "Security scan: check git status and scan tracked files for risky key/secret patterns."
version: "1.0"
steps:
  - name: Check Git Tracked Files
    description: "Ensure no temporary or secret files are untracked in git root."
    command: "git status --porcelain"
    risk_level: "low"
  - name: Scan Config Key Patterns
    description: "Scan for hardcoded secret variables."
    command: "grep -rn 'API_KEY' --exclude-dir='.git' --exclude-dir='.venv' --exclude='*.jsonl' . || true"
    risk_level: "low"
